[package]
name = "roses"
version = "0.1.0"
edition = "2024"

[dependencies]
ab_glyph = "0.2"
anyhow = "1.0"
axum = "0.8"
image = "0.25"
imageproc = "0.27"
jiff = "1.0"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread"] }

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
strip = "symbols"
